name: Flutter app

on:
  push:
    paths: ['flutter_app/**', 'model/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter_app/**', 'model/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Android APK
        run: flutter build apk --release
      - name: Web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-farming-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smart-farming-web
          path: flutter_app/build/web
